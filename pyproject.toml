[project]
name = "frapsec"
version = "0.1.0"
description = "Framework-aware security scanner for Frappe/ERPNext benches"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.0"]

[project.scripts]
frapsec = "frapsec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frapsec*"]

[tool.setuptools.package-data]
frapsec = ["semgrep_rules/*", "templates/*"]
