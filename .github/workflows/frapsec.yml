# Reusable scan workflow — this file lives in frapsec's own repo as the
# canonical copy. It is NOT meant to run against frapsec itself (nothing
# useful to scan here); it only fires when a connector repo calls it via
# workflow_call. Copy this file into a connector repo's own .github/workflows/
# and add push/pull_request triggers there, or reference it directly:
#
#   jobs:
#     scan:
#       uses: loyality7/frapsec/.github/workflows/frapsec.yml@main
#       with:
#         app_path: .
#       secrets:
#         frapsec_repo_token: ${{ secrets.FRAPSEC_REPO_TOKEN }}
#
# frapsec's repo is private, so installing it in another repo's CI needs a
# token with read access to it -- a PAT (classic, `repo` scope) stored as
# FRAPSEC_REPO_TOKEN in the CALLING repo's secrets. Make frapsec public
# instead and this whole secret goes away.
name: frapsec

on:
  workflow_call:
    inputs:
      app_path:
        type: string
        default: "."
    secrets:
      frapsec_repo_token:
        required: true

env:
  APP_PATH: ${{ inputs.app_path || '.' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frapsec + semgrep
        run: |
          pip install semgrep
          pip install "git+https://x-access-token:${{ secrets.frapsec_repo_token }}@github.com/loyality7/frapsec.git"

      - name: Scan
        run: frapsec scan app "$APP_PATH" --format sarif > frapsec.sarif
        continue-on-error: true   # report via SARIF; gate is the next step

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frapsec.sarif

      - name: Gate on critical/high
        run: frapsec scan app "$APP_PATH" --no-semgrep > /dev/null
