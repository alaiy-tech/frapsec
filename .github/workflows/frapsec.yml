# Reusable scan workflow. Copy into a connector repo (or call via workflow_call)
# and set APP_PATH to the app directory to scan.
name: frapsec

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_call:
    inputs:
      app_path:
        type: string
        default: "."

env:
  APP_PATH: ${{ inputs.app_path || '.' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frapsec + semgrep
        run: |
          pip install semgrep
          pip install git+https://github.com/loyality7/frapsec.git  # adjust when repo is pushed

      - name: Scan
        run: frapsec scan app "$APP_PATH" --format sarif > frapsec.sarif
        continue-on-error: true   # report via SARIF; gate is the next step

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frapsec.sarif

      - name: Gate on critical/high
        run: frapsec scan app "$APP_PATH" --no-semgrep > /dev/null
