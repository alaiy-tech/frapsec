# Reusable scan workflow — this file lives in frapsec's own repo as the
# canonical copy. It is NOT meant to run against frapsec itself (nothing
# useful to scan here); it only fires when a connector repo calls it via
# workflow_call. Copy this file into a connector repo's own .github/workflows/
# and add push/pull_request triggers there, or reference it directly:
#
#   jobs:
#     scan:
#       uses: alaiy-tech/frapsec/.github/workflows/frapsec.yml@main
#       with:
#         app_path: .
#
# frapsec is public, so no token or secret is needed to install it.
name: frapsec

on:
  workflow_call:
    inputs:
      app_path:
        type: string
        default: "."
      baseline:
        description: >-
          Path to a frapsec baseline file. Findings recorded in it are not
          reported and do not fail the build, so an app with known existing
          findings can adopt the gate and still block anything NEW.
        type: string
        default: ""

env:
  APP_PATH: ${{ inputs.app_path || '.' }}
  BASELINE_ARG: ${{ inputs.baseline && format('--baseline {0}', inputs.baseline) || '' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frapsec + semgrep
        run: |
          pip install semgrep
          pip install "git+https://github.com/alaiy-tech/frapsec.git"

      - name: Scan
        run: frapsec scan app "$APP_PATH" $BASELINE_ARG --format sarif > frapsec.sarif
        continue-on-error: true   # report via SARIF; gate is the next step

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frapsec.sarif

      - name: Gate on critical/high
        run: frapsec scan app "$APP_PATH" $BASELINE_ARG --no-semgrep > /dev/null
