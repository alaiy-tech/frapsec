# Security-relevant subset: broadcast-to-everyone info disclosure, unauthorized runtime patching
rules:
- id: frapsec-realtime-pick-room
  patterns:
    - pattern: frappe.publish_realtime(...)
    - pattern-not: frappe.publish_realtime(..., doctype=$SOMETHING, ...)
    - pattern-not: frappe.publish_realtime(..., docname=$SOMETHING, ...)
    - pattern-not: frappe.publish_realtime(..., room=$SOMETHING, ...)
    - pattern-not: frappe.publish_realtime(..., user=$SOMETHING, ...)
  message: |
    This call will publish message to everyone on site, do you really want that? Specify doctype, docname, room or user.
  languages: [python]
  severity: ERROR
- id: frapsec-monkey-patching-not-allowed
  patterns:
    - pattern-either:
      - pattern: |
          from $X import $Y
          ...
          $Y.$PROPERTY = ...
      - pattern: |
          from $X import $Y
          ...
          $Y.$Z.$PROPERTY = ...
      - pattern: |
          from $X import $Y
          ...
          $Y.$Z.$F.$PROPERTY = ...
      - pattern: |
          from $X import $Y
          ...
          $Y.$Z.$F.$K.$PROPERTY = ...
      - pattern: |
          from $X import $Y
          ...
          $Y.$Z.$F.$K.$J.$PROPERTY = ...
      - pattern: |
          from $X import $Y
          ...
          $Y.$Z.$F.$K.$J.$L.$PROPERTY = ...
  message: |
    $PROPERTY being monkey patched by app. Use hooks provided by framework instead of patching behaviour at runtime.
  paths:
      exclude:
        - "**/test_*.py"
  languages: [python]
  severity: ERROR
