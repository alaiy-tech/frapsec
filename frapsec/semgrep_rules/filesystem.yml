rules:
- id: frapsec-security-file-traversal
  patterns:
  - pattern-either:
    - pattern: open(...)
  message: |
    Detected the file system access. This code should be manually audited by
    security team to avoid file traversal issues.
  languages: [python]
  severity: WARNING
  paths:
    exclude:
      - "**/test_*.py"
      # packaging boilerplate reads its own requirements.txt at build time --
      # never a runtime request handler, confirmed FP scanning a real connector
      - "**/setup.py"
